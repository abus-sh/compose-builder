[package]
name = "compose-builder"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/abus-sh/compose-builder"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0.105"
clap = { version = "4.6.9", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = { version = "2.2.0", default-features = false, features = [
  "deserialize",
] }
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.21"
walkdir = "2.5.1"
